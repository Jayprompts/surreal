name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

# The website's public settings are baked in at build time. CI only builds it, so placeholders are enough.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

jobs:
  api:
    name: API + web · typecheck, lint, build, migrate, guard checks, health
    runs-on: ubuntu-latest
    services:
      # A throwaway Postgres for this run only. Its credentials are CI-only, never used anywhere else.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 4300
      WEB_URL: http://localhost:3000
      # Only its public signing keys are fetched, on the first signed-in request (none in CI yet).
      SUPABASE_URL: http://127.0.0.1:54321
      # CI-only throwaway values (this run's database is deleted afterwards).
      KEY_HASH_SECRET: ci-only-key-hash-secret-not-used-anywhere-else
      KEY_ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      MAIL_FROM: Surreal CI <ci@surreal.local>
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://surreal_api_ci:ci_only@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply migrations
        working-directory: api
        run: node dist/scripts/migrate.js

      - name: Create the API login (member of surreal_api)
        working-directory: api
        run: node dist/scripts/db-local-user.js

      - name: Database guard checks
        working-directory: api
        run: node dist/scripts/db-check.js

      - name: Start the API and check health
        working-directory: api
        run: |
          node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf localhost:4300/api/health; then echo; exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

  windows:
    name: Windows · install, typecheck, build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
