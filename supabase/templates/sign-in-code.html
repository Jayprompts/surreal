<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f5f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#111">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#fff;border-radius:12px;padding:32px">
            <tr><td style="font-size:20px;font-weight:700;padding-bottom:16px">Surreal</td></tr>
            <tr><td style="font-size:15px;line-height:1.5;padding-bottom:20px">Here is your sign-in code. It expires in 10 minutes.</td></tr>
            <tr><td style="font-size:32px;font-weight:700;letter-spacing:8px;padding-bottom:24px">{{ .Token }}</td></tr>
            <tr><td style="font-size:13px;line-height:1.5;color:#666">If you didn't try to sign in, you can ignore this email. Never share this code with anyone; Surreal staff will never ask for it.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
